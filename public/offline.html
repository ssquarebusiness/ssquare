<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Offline · SSquare</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b3d2e; color: #fff;
      font-family: system-ui, -apple-system, "Noto Sans Gujarati", "Noto Sans Devanagari", sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #b0eac7; margin: 4px 0; line-height: 1.5; }
    button { margin-top: 20px; background: #d4f53c; color: #062219; border: 0; border-radius: 14px; padding: 14px 28px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="72" height="72" alt="SSquare" />
    <h1>No internet connection</h1>
    <p>Please check your internet and try again.</p>
    <p>ઇન્ટરનેટ ચાલુ કરીને ફરી પ્રયાસ કરો.</p>
    <p>इंटरनेट चालू करके फिर से कोशिश करें।</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
